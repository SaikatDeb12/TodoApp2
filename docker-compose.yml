version: "3.8"

services:
    db:
        image: postgres:16
        container_name: todo2-postgres
        restart: unless-stopped
        ports:
            - "5433:5432"
        environment:
            POSTGRES_USER: todo2_user
            POSTGRES_PASSWORD: todo2_pass
            POSTGRES_DB: todo_db
        volumes:
            - pgdata://var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U todo2_user -d todo2_db"]
            interval: 5s
            timeout: 5s
            retries: 5
volumes:
    pgdata:
